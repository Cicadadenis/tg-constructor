<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ошибки разработчиков — Cicada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #060818;
      --bg: #0a0b14;
      --panel: rgba(14, 16, 32, 0.92);
      --border: rgba(120, 140, 255, 0.2);
      --text: #e8ecff;
      --muted: #8b93c9;
      --accent: #fcd34d;
      --cyan: #00f2ff;
      --purple: #bc00ff;
      --magenta: #e040fb;
      --frontend: #60a5fa;
      --api: #a78bfa;
      --backend: #f87171;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --ui: 'Manrope', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--ui);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% 100%, rgba(188, 0, 255, 0.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 15% 90%, rgba(0, 242, 255, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #060818 0%, #0a0b14 100%);
      pointer-events: none;
      z-index: 0;
    }
    .app-shell {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin: 8px;
      border-radius: 12px;
      border: 1px solid transparent;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        linear-gradient(135deg, var(--magenta), var(--purple), var(--cyan)) border-box;
      box-shadow: 0 0 20px rgba(188, 0, 255, 0.2), 0 0 40px rgba(0, 242, 255, 0.08);
      overflow: hidden;
    }
    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: linear-gradient(90deg, #c026d3 0%, #7c3aed 35%, #2563eb 70%, #0891b2 100%);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.25);
    }
    header .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.2);
    }
    .nav-back {
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.15);
      transition: background 0.15s;
    }
    .nav-back:hover { background: rgba(0,0,0,0.3); }
    .toolbar {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }
    button, select {
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(10, 12, 28, 0.75);
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    button:hover, select:hover {
      border-color: rgba(255,255,255,0.35);
      background: rgba(20, 24, 48, 0.9);
    }
    select { min-width: 140px; }
    button.primary {
      background: rgba(0, 0, 0, 0.35);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(252, 211, 77, 0.25);
    }
    button.primary:hover {
      background: rgba(252, 211, 77, 0.12);
      box-shadow: 0 0 16px rgba(252, 211, 77, 0.35);
    }
    button.danger {
      border-color: rgba(248, 113, 113, 0.5);
      color: #fca5a5;
    }
    button.danger:hover {
      background: rgba(248, 113, 113, 0.12);
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      min-height: 0;
      background: rgba(0, 0, 0, 0.25);
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }
    .list-panel {
      border-right: 1px solid var(--border);
      overflow: auto;
      min-height: 0;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .stats {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.2);
    }
    .stats span strong { color: var(--text); font-weight: 600; }
    .error-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .error-item:hover {
      background: rgba(0, 242, 255, 0.06);
    }
    .error-item.active {
      background: linear-gradient(90deg, rgba(192, 38, 211, 0.15), rgba(37, 99, 235, 0.12));
      border-left: 3px solid var(--magenta);
    }
    .error-item .top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .pill.frontend { background: rgba(96,165,250,0.2); color: var(--frontend); }
    .pill.api { background: rgba(167,139,250,0.2); color: var(--api); }
    .pill.backend { background: rgba(248,113,113,0.2); color: var(--backend); }
    .error-item .msg {
      font-size: 13px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .error-item time { font-size: 11px; color: var(--muted); margin-left: auto; }
    .detail-panel {
      overflow: auto;
      padding: 24px;
      min-height: 0;
      background: rgba(8, 10, 24, 0.6);
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 48px 24px;
      text-align: center;
      line-height: 1.6;
    }
    .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.7;
    }
    .detail h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      word-break: break-word;
      color: #fff;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .meta strong { color: var(--cyan); font-weight: 600; }
    pre.stack {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      background: rgba(4, 6, 18, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    }
    .offline {
      padding: 10px 16px;
      background: linear-gradient(90deg, rgba(90, 20, 40, 0.95), rgba(60, 10, 50, 0.95));
      color: #ffb4d4;
      font-size: 13px;
      display: none;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .offline.show { display: block; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(192,38,211,0.4), rgba(37,99,235,0.4));
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="offline" class="offline">Панель недоступна — запустите сервер: npm run dev:full (NODE_ENV=development).</div>
  <div class="app-shell">
    <header>
      <h1>Ошибки разработчиков</h1>
      <span class="badge">только dev</span>
      <a href="/debug" class="nav-back">← Debug IDE</a>
      <div class="toolbar">
        <label>
          Фильтр
          <select id="filter">
            <option value="">Все источники</option>
            <option value="frontend">Фронтенд</option>
            <option value="api">API</option>
            <option value="backend">Бэкенд</option>
          </select>
        </label>
        <button type="button" id="pause">Пауза</button>
        <button type="button" class="primary" id="refresh">Обновить</button>
        <button type="button" class="danger" id="clear">Очистить всё</button>
      </div>
    </header>
    <div class="layout">
      <aside class="list-panel">
        <div class="stats" id="stats">Загрузка…</div>
        <div id="list"></div>
      </aside>
      <main class="detail-panel" id="detail">
        <p class="empty"><span class="empty-icon">📋</span><br>Выберите ошибку из списка</p>
      </main>
    </div>
  </div>
  <script src="/dev/errors-app.js"></script>
</body>
</html>
