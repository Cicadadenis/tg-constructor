version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cicada}
      POSTGRES_USER: ${DB_USER:-cicada_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cicada_user} -d ${DB_NAME:-cicada}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      API_HOST: ${API_HOST:-localhost}
      API_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cicada}
      DB_USER: ${DB_USER:-cicada_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DSL_SANDBOX_NETWORK: ${DSL_SANDBOX_NETWORK:-none}
      PREVIEW_MAX_CONCURRENT: ${PREVIEW_MAX_CONCURRENT:-8}
      PREVIEW_SANDBOX_NETWORK: ${PREVIEW_SANDBOX_NETWORK:-none}
      ADMIN_KEY: ${ADMIN_KEY}
      PYTHON_BIN: ${PYTHON_BIN:-python3}
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production}
      DSL_SANDBOX_MODE: ${DSL_SANDBOX_MODE:-enforced}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      DEFAULT_CHAT_ID: ${DEFAULT_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OLLAMA_URL: ${OLLAMA_URL:-https://api.groq.com/openai}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama-3.3-70b-versatile}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GROQ_TOKEN: ${GROQ_TOKEN:-}
      GROQ_TOKEN_2: ${GROQ_TOKEN_2:-}
      GROQ_TOKEN_3: ${GROQ_TOKEN_3:-}
      DSL_MAX_RUNTIME_MS: ${DSL_MAX_RUNTIME_MS:-300000}
      DSL_MAX_CODE_BYTES: ${DSL_MAX_CODE_BYTES:-100000}
    volumes:
      - ./bots:/app/bots
      - ./uploads:/app/uploads
      - ./data/esphome-constructor:/app/data/esphome-constructor
      - ./public/firmware:/app/public/firmware

volumes:
  pgdata:
